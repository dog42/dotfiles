# Central Theme Color Configuration for chezmoi
# All colors for Hyprland, Waybar, Walker, Dunst, Kitty, Zsh, Neovim, and Xournal++ are controlled here.

[theme]
name = "ashen-dark"

[colors]
# Base Backgrounds (OLED Black concept)
bg              = "#000000"  # Pure black (Terminal, Neovim, Xournal++)
bg_surface      = "#161616"  # Cards, popovers, launcher, notifications (Dunst, Walker, Waybar tooltips)
bg_alt          = "#212121"  # Module backgrounds, tabs, panels
bg_subtle       = "#2c2c2c"  # Hover, selection, subtle highlights

# Foregrounds & Text
fg              = "#e5e5e5"  # Primary text (crisp ash white)
fg_muted        = "#a7a7a7"  # Secondary text, subtext, captions
fg_dim          = "#686868"  # Keybindings hints, disabled items

# Harmonious Ember Red Accents
accent          = "#cc1111"  # Primary ember red (active window border, active workspace, cursor)
accent_glow     = "#df6464"  # Glowing red (focus highlights, cursor glow, hover)
accent_dim      = "#991111"  # Deep smoldering red (shadows, subtle accents)
accent_bright   = "#ff2a2a"  # Alert / critical notifications

# Window Borders
border_active   = "#cc1111"  # Focused window border
border_inactive = "#3a3a3a"  # Unfocused window border

# Status / Secondary accents (Harmonized with Ashen)
success         = "#629c7d"  # Muted moss green (Git clean, Connected status)
warning         = "#e49a44"  # Amber / warm yellow (Battery warning, pending updates)
error           = "#c53030"  # Error red
info            = "#4a8b8b"  # Muted teal / cyan (Hyprlock check, Git changes)

# 16-Color Terminal ANSI Palette (Kitty, Zsh Prompt & CLI tools)
[colors.ansi]
black           = "#161616"
red             = "#cc1111"
green           = "#629c7d"
yellow          = "#e49a44"
blue            = "#4a8b8b"
magenta         = "#bd4c4c"
cyan            = "#5b9e9e"
white           = "#d5d5d5"
bright_black    = "#3a3a3a"
bright_red      = "#df6464"
bright_green    = "#78b895"
bright_yellow   = "#f0af5e"
bright_blue     = "#63a8a8"
bright_magenta  = "#d66565"
bright_cyan     = "#75b8b8"
bright_white    = "#ffffff"
