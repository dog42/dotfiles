# Central Theme Color Configuration for chezmoi
# All colors for Hyprland, Waybar, Walker, Dunst, Kitty, Zsh, Neovim, and Xournal++ are controlled here.

[theme]
name = "ashen-dark"

[colors]
# Base Backgrounds (OLED Black concept)
bg              = "#000000"  # Pure deep black (terminal background, Neovim, Xournal++)
bg_surface      = "#161616"  # Charcoal / dark gray for cards, notifications (Dunst), Walker launcher, Waybar tooltips, Hyprlock field
bg_alt          = "#212121"  # Module backgrounds, inactive tabs, Waybar panel
bg_subtle       = "#2c2c2c"  # Hover effects, terminal selections

# Foregrounds & Text
fg              = "#e5e5e5"  # Ash white – primary text, terminal foreground, Kitty cursor
fg_muted        = "#a7a7a7"  # Muted medium gray – Hyprlock text/password dots, secondary text, subtitles
fg_dim          = "#686868"  # Dark gray – keybinding hints, disabled elements

# Harmonious Ember Red Accents
accent          = "#cc1111"  # Primary ember red – active window border (Hyprland), active workspaces, Yazi folder icons, tab highlights
accent_glow     = "#e54228"  # Bright scarlet / warm ember red – clickable terminal links (Kitty URL), focus effects
accent_dim      = "#991111"  # Darker glow red – subtle shadows and shading
accent_bright   = "#ff2a2a"  # High-visibility alert red – critical notifications (Dunst urgency=critical)

# Window Borders
border_active   = "#cc1111"  # Active Hyprland window border & active Kitty border (ember red)
border_inactive = "#3a3a3a"  # Inactive window borders (subtle graphite gray)

# Status / Secondary accents (Harmonized with Ashen)
success         = "#629c7d"  # Moss green – clean git status / healthy connections
warning         = "#e49a44"  # Amber / warm yellow-orange – warnings, battery warning
error           = "#c53030"  # Crimson red – error messages
info            = "#54799e"  # Slate blue – Hyprlock check, git modifications

# 16-Color Terminal ANSI Palette (Kitty, Zsh Prompt & CLI tools like agy)
[colors.ansi]
black           = "#161616"  # ANSI  0: Charcoal black (background CLI elements)
red             = "#cc1111"  # ANSI  1: Dark ember red (git dirty, errors, Zsh prompt prefix)
green           = "#629c7d"  # ANSI  2: Moss green (git clean, success messages)
yellow          = "#e49a44"  # ANSI  3: Amber (warnings, numbers, CLI hints)
blue            = "#e54228"  # ANSI  4: Warm ember red / scarlet (clickable links in CLI tools, markdown hyperlinks)
magenta         = "#bd4c4c"  # ANSI  5: Muted ruby red (special CLI identifiers, symbols)
cyan            = "#e54228"  # ANSI  6: Warm ember red / scarlet (paths, file references, alternative link color)
white           = "#d5d5d5"  # ANSI  7: Light ash gray (standard terminal text normal)
bright_black    = "#3a3a3a"  # ANSI  8: Graphite gray (comments, dim text)
bright_red      = "#e54228"  # ANSI  9: Bright ember red (Zsh git ahead/behind, highlighted warnings)
bright_green    = "#78b895"  # ANSI 10: Bright spring green (git clean checkmark '✔', diff add)
bright_yellow   = "#f0af5e"  # ANSI 11: Bright amber / gold (highlighted parameters/flags)
bright_blue     = "#ff5e45"  # ANSI 12: Light scarlet (active/focused links in CLIs)
bright_magenta  = "#d66565"  # ANSI 13: Coral red (constants, regex matches)
bright_cyan     = "#ff5e45"  # ANSI 14: Light scarlet (clickable URLs & markdown links)
bright_white    = "#ffffff"  # ANSI 15: Pure white (bold/highlighted text, git branch name)
