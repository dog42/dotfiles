[opener]
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
]
play = [
  { run = 'mpv %s', orphan = true, for = "unix" },
]
open = [
  { run = 'xdg-open %s1', desc = "open" },
]
zathura = [
  { run = 'zathura %s1', orphan = true, desc = "zathura" },
]
xournalpp = [
  { run = 'xournalpp %s1', orphan = true, desc = "xournal++" },
]
browser = [
  { run = 'brave %s1', desc = "browser" },
]
firefox = [
  { run = 'firefox %s1', orphan = true, desc = "firefox" },
]

[open]
prepend_rules = [
  { url = "*.html", use = [ "browser", "edit" ] },
  { url = "*.pdf", use = [  "zathura", "xournalpp", "firefox", "browser" ] },
  { url = "*.tex", use = [ "edit" ] },
  { url = "*.lua", use = [ "edit" ] },
  { url = "*.toml", use = [ "edit" ] },
]
