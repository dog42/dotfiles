[opener]
edit = [
  { run = 'nvim "%s"', block = true, for = "unix" },
]
play = [
  { run = 'mpv "%s1"', orphan = true, for = "unix" },
]
open = [
  { run = 'xdg-open "%s1"', desc = "open" },
]
okular = [
  { run = 'okular "%s1"', orphan = true, desc = "okular" },
]
xournalpp = [
  { run = 'xournalpp "%s1"', orphan = true, desc = "xournal++" },
]
browser = [
  { run = 'brave "%s1"', desc = "browser" },
]
firefox = [
  { run = 'firefox "%s1"', orphan = true, desc = "firefox" },
]

[open]
prepend_rules = [
  { url = "*.html", use = [ "browser", "edit" ] },
  { url = "*.pdf", use = [ "okular", "firefox", "xournalpp", "browser" ] },
  { url = "*.tex", use = [ "edit" ] },
]
