[opener]
edit = [
  { run = "nvim \"$@\"", block = true, for = "unix" },
]
play = [
  { run = "mpv \"$@\"", orphan = true, for = "unix" },
]
open = [
  { run = "kde-open \"$@\"", desc = "open" },
]
xournalpp = [
  { run = "xournalpp \"$@\"", desc = "xournal++" },
]
browser = [
  { run = "brave \"$@\"", desc = "browser" },
]

[open]
prepend_rules = [
  { url = "*.html", use = [ "browser", "edit" ] },
  { url = "*.pdf", use = [ "xournalpp", "browser" ] },
]
