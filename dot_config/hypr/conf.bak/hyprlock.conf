background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    path = ~/.config/bulb.jpeg
    blur_passes = 2
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(50, 50, 50, 1.0)
    outer_color = rgba(255, 0, 0, 1.0)
    outline_thickness = 4

    font_family = CaskaydiaMono Nerd Font Propo
    # font_color = $font_color

    placeholder_text = Enter Password 󰈷
    check_color = rgba(0, 100, 130, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 4
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
