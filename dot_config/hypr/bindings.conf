# See https://wiki.hypr.land/Configuring/Keywords/

$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bindd = $mainMod, return, terminal, exec, $terminal
bindd = $mainMod SHIFT, C, kill window, killactive,
bindd = $mainMod SHIFT, E, logout, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bindd = $mainMod, R, reload hypr and waybar, exec, hyprctl reload & killall -SIGUSR2 waybar
bindd = $mainMod, L, lock screen, exec, hyprlock
bindd = $mainMod, Y, file manager, exec, $terminal -e yazi
bindd = $mainMod, N, editor/nvim, exec, $terminal -e nvim
bindd = $mainMod, S, localsend, exec, localsend
bindd = $mainMod, V, toggle floating window, togglefloating,
bindd = $mainMod, space, launcher, exec, $menu
bindd = $mainMod, B, show keybindings, exec, showkeybindings
bindd = $mainMod, M, monitorconfig, exec, $terminal -e hyprdynamicmonitors tui
bindd = $mainMod, T, tailscale-waybar-menue, exec, /home/$USER/.config/waybar/waybar-tailscale/waybar-tailscale.sh --menue
bindd = $mainMod, G, gemeni/antigravity-cli, exec, type agy && $terminal -e agy || antigravity-ide 

# Screenshot 
bindd = SHIFT, PRINT,screenshot window, exec, hyprshot -m window -o /home/$USER/Bilder/screenshot
bindd = CTRL, PRINT,screenshot region, exec, hyprshot -m region -o /home/$USER/Bilder/screenshot
bindd = , PRINT,screenshot monitor, exec, hyprshot -m output -m active -o /home/$USER/Bilder/screenshot

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, move left, movefocus, l
bindd = $mainMod, right, move right, movefocus, r
bindd = $mainMod, up, move up, movefocus, u
bindd = $mainMod, down, move down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, workspace 1, workspace, 1
bindd = $mainMod, 2, workspace 2, workspace, 2
bindd = $mainMod, 3, workspace 3, workspace, 3
bindd = $mainMod, 4, workspace 4, workspace, 4
bindd = $mainMod, 5, workspace 5, workspace, 5
bindd = $mainMod, 6, workspace 6, workspace, 6
bindd = $mainMod, 7, workspace 7, workspace, 7
bindd = $mainMod, 8, workspace 8, workspace, 8
bindd = $mainMod, 9, workspace 9, workspace, 9
bindd = $mainMod, 0, workspace 10, workspace, 10

# resize window
binde = $mainMod CTRL,left,resizeactive,-20 0
binde = $mainMod CTRL,right,resizeactive,20 0
binde = $mainMod CTRL,up,resizeactive,0 -20
binde = $mainMod CTRL,down,resizeactive,0 20

# move window to other monitor
unbind = $mainMod SHIFT, left 
unbind = $mainMod SHIFT, right
bindd = $mainMod SHIFT, left, move window left, movewindow, l
bindd = $mainMod SHIFT, right, move window right, movewindow, r
bindd = $mainMod SHIFT, up, move window up, movewindow, u
bindd = $mainMod SHIFT, down, move window up, movewindow, d

# Move active window to a workspace with $mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, code:10, Move window to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT, code:11, Move window to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT, code:12, Move window to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT, code:13, Move window to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod SHIFT, code:14, Move window to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod SHIFT, code:15, Move window to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod SHIFT, code:16, Move window to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod SHIFT, code:17, Move window to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod SHIFT, code:18, Move window to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod SHIFT, code:19, Move window to workspace 10, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
