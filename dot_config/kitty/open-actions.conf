# Kitty Open Actions Configuration
# Controls what happens when clicking links or files in Kitty terminal.

# 1. Open files with line numbers directly at that line in Neovim (e.g. file.py#42 or file:42)
protocol file
fragment_matches [0-9]+
action launch --type=overlay --cwd=current nvim +${FRAGMENT} -- ${FILE_PATH}

# 2. Open any text file in Neovim overlay
protocol file
mime text/*
action launch --type=overlay --cwd=current nvim -- ${FILE_PATH}

# 3. Code, config, and script files (even if detected as application/*)
protocol file
ext json,toml,yaml,yml,lua,conf,ini,sh,bash,zsh,rs,c,h,cpp,py,ts,js,tsx,jsx,md,txt,css,html,xml,csv,sql
action launch --type=overlay --cwd=current nvim -- ${FILE_PATH}

# 4. Open directories in Yazi file manager
protocol file
mime inode/directory
action launch --type=overlay --cwd=current yazi -- ${FILE_PATH}

# 5. View images in terminal using kitty icat
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- ${FILE_PATH}

# 6. Fallback: Open non-text files with xdg-open in background (e.g. PDFs with Zathura)
protocol file
action launch --type=background xdg-open -- ${FILE_PATH}
